monorepo_root = true

[monorepo]
config_roots = ["protocol", "core", "demo", "pi", "composio", "browser", "api", "web"]

[tools]
node = "24"

[tasks.install]
description = "Install workspace dependencies"
sources = ["package.json", "package-lock.json", "*/package.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm install --no-audit --no-fund"

[tasks.generate]
description = "Generate artifacts from the protocol (JSON Schema, OpenRPC)"
depends = ["//protocol:generate"]
run = "true"

[tasks.check]
description = "Type-check and test every package"
depends = ["//protocol:check", "//core:check", "//demo:check", "//pi:check", "//composio:check", "//browser:check", "//api:check", "//web:check"]
run = "true"

[tasks.dev]
description = "Dev preview: API (restarts on change) + Vite with HMR, using ~/.config/remuse/dev.env; web on $REMUSE_HOST:5184"
depends = ["install"]
run = '''
set -a; . "$HOME/.config/remuse/dev.env"; set +a
export VITE_REMUSE_URL="ws://$REMUSE_HOST:$REMUSE_PORT/rpc?token=$REMUSE_TOKEN"
trap 'kill 0' EXIT
(cd api && node --watch src/main.ts) &
(cd web && npx vite --port 5184 --strictPort --host "$REMUSE_HOST") &
wait
'''
