monorepo_root = true

[monorepo]
config_roots = ["protocol", "core", "demo", "pi", "composio", "browser", "api", "web"]

[tools]
node = "24"

[tasks.install]
description = "Install workspace dependencies"
sources = ["package.json", "package-lock.json", "*/package.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm install --no-audit --no-fund"

[tasks.generate]
description = "Generate artifacts from the protocol (JSON Schema, OpenRPC)"
depends = ["//protocol:generate"]
run = "true"

[tasks.dockerfile-check]
description = "Every workspace is copied into the Docker image"
run = "node scripts/check-dockerfile.ts"

[tasks.check]
description = "Type-check and test every package"
depends = ["dockerfile-check", "//protocol:kotlin", "//protocol:check", "//core:check", "//demo:check", "//pi:check", "//composio:check", "//browser:check", "//api:check", "//web:check"]
run = "true"

[tasks.dev]
description = "Dev preview: the browser pool (Docker), API (restarts on change) + Vite with HMR, using ~/.config/remuse/dev.env; web on $REMUSE_HOST:5184"
depends = ["install"]
run = '''
set -a; . "$HOME/.config/remuse/dev.env"; set +a
# the web server stands in front of the API: one origin, so the session cookie just works
export VITE_REMUSE_MODE=same-origin REMUSE_API="http://$REMUSE_HOST:$REMUSE_PORT"
# the auto-browser pool, published on localhost (REMUSE_BROWSERS in the dev env points at it)
mkdir -p "$HOME/.local/share/remuse/dev-handoff/1" "$HOME/.local/share/remuse/dev-handoff/2" "$HOME/.local/share/remuse/dev-handoff/3"
docker compose -p remuse-browsers -f compose.browsers.yaml -f compose.dev.yaml up -d --wait
trap 'kill 0' EXIT
(cd api && node --watch src/main.ts) &
(cd web && npx vite --port 5184 --strictPort --host "$REMUSE_HOST") &
wait
'''
