[tasks.check]
description = "Type-check, test and build the web app (into a temp dir, leaving dist alone)"
depends = ["//:install"]
run = "npm run typecheck && node --test src/*.test.ts && npx vite build --outDir \"$(mktemp -d)\" --emptyOutDir --logLevel warn"

[tasks.dev]
description = "Vite dev server"
depends = ["//:install"]
run = "npm run dev"

[tasks.build-dev]
description = "Build dist for the API to serve on its own origin (REMUSE_WEB)"
depends = ["//:install"]
run = "VITE_REMUSE_MODE=same-origin npx vite build --logLevel warn"
