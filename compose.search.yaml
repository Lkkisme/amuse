name: amuse-search
services:
  search:
    # Official mirror, version 2026.10.19-81371861f; fixed manifest digest.
    image: ghcr.io/searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    container_name: amuse-local-search
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8889/"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    volumes:
      - type: bind
        source: ${AMUSE_SEARCH_STATE:?Set AMUSE_SEARCH_STATE to the persistent search directory}/config
        target: /etc/searxng
      - type: bind
        source: ${AMUSE_SEARCH_STATE:?Set AMUSE_SEARCH_STATE to the persistent search directory}/cache
        target: /var/cache/searxng
    cpus: 1.0
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 45s
