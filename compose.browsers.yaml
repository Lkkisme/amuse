# The browser pool: auto-browser pairs (a headful Chromium desktop with noVNC, and its REST
# controller). One session per node (one desktop each), so concurrency = number of pairs (3).
# Each pair has its own internal network; only the node gets an egress network, and the sandbox's network,
# so the browser can open what Amuse serves in its sandbox (http://sandbox:<port>; the sandbox cannot connect
# back: its rules let out only replies on that network). No Docker socket.
# Secrets are made on first start by `secrets` (kept in its volume, never typed in): the bearer
# token between amuse and the controllers, and the key that encrypts saved logins.
# Used by compose.yaml (production) and compose.dev.yaml (published on localhost for `mise run dev`).
# More pairs: copy a pair block and add it to AMUSE_BROWSERS in compose.yaml.
# Images build from auto-browser at a pinned commit (a fork carrying the desktop-resize fix).

x-node: &node
  build: https://github.com/Microwave-WYB/auto-browser.git#fe9f152c5dd9859b225b6322452b05a709958deb:browser-node
  image: ${AB_NODE_IMAGE:-amuse-ab-node:fe9f152}
  restart: unless-stopped
  shm_size: 2gb
  mem_limit: 3g
  cpus: 1.5
  pids_limit: 1024
  # starts as root to chown the profile volume, then drops to the browser user
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
    - /home/browser:size=512m,uid=10001,gid=10001
    - /data/downloads:size=512m,uid=10001,gid=10001
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD-SHELL, "test -s /data/profile/browser-ws-endpoint.txt && curl -s --max-time 3 -o /dev/null http://127.0.0.1:9223/ && curl -fsS --max-time 3 http://127.0.0.1:6080/ >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 15s

x-node-env: &node-env
  # 4:3, the classic desktop breakpoint: full desktop layouts, and bigger on a phone than 16:10
  BROWSER_WIDTH: "1024"
  BROWSER_HEIGHT: "768"
  BROWSER_URL: about:blank
  BROWSER_WS_ENDPOINT_FILE: /data/profile/browser-ws-endpoint.txt
  PLAYWRIGHT_SERVER_HOST: 0.0.0.0
  PLAYWRIGHT_SERVER_PORT: "9223"

x-controller: &controller
  build: https://github.com/Microwave-WYB/auto-browser.git#40ecdf8f60345e67ea7960fd3bf9ba07957aea8f:controller
  image: ${AB_CONTROLLER_IMAGE:-amuse-ab-controller:40ecdf8}
  restart: unless-stopped
  # the controller reads secrets from env only: load them from the secrets volume, then start as usual
  command:
    - sh
    - -c
    - API_BEARER_TOKEN="$$(cat /secrets/auto-browser-token)" AUTH_STATE_ENCRYPTION_KEY="$$(cat /secrets/logins-key)" exec uvicorn app.main:app --host 0.0.0.0 --port 8000
  stop_grace_period: 60s
  mem_limit: 768m
  cpus: 0.75
  pids_limit: 256
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 15s

x-controller-env: &controller-env
  APP_ENV: development # production refuses ALLOWED_HOSTS="*"; the agent browses the open web
  API_BIND_SCOPE: exposed
  REQUIRE_AUTH_STATE_ENCRYPTION: "true"
  ALLOWED_HOSTS: "*"
  MAX_SESSIONS: "1"
  # amuse asks the user before every upload itself (the controller's own approvals are not seen by anyone)
  REQUIRE_APPROVAL_FOR_UPLOADS: "false"
  REQUEST_RATE_LIMIT_REQUESTS: "1200"
  AUTH_STATE_MAX_AGE_HOURS: "720"

services:
  # first start only: make the secrets that are missing; later starts leave them alone
  secrets:
    image: ${AB_CONTROLLER_IMAGE:-amuse-ab-controller:40ecdf8}
    user: "0"
    read_only: true
    network_mode: none
    restart: "no"
    volumes: [secrets:/secrets, handoff-1:/handoff/1, handoff-2:/handoff/2, handoff-3:/handoff/3]
    entrypoint:
      - python
      - -c
      - |
        import base64, os, secrets
        def make(name, value, owner, mode):
            path = f"/secrets/{name}"
            try:
                fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, mode)
            except FileExistsError:
                return
            os.write(fd, value.encode()); os.close(fd); os.chown(path, owner, 0)
        os.chmod("/secrets", 0o711)  # enter, never list; the controllers have no capability to bypass it
        # amuse (uid 1000) owns the token; the controllers (root, without capabilities) read it as group 0
        make("auto-browser-token", secrets.token_hex(24), 1000, 0o440)
        make("logins-key", base64.urlsafe_b64encode(os.urandom(32)).decode(), 0, 0o400)  # Fernet key, controllers only
        # the folders amuse hands a file to upload through: amuse (uid 1000) puts it there, the controller
        # (root without capabilities) makes its own session folder beside it and reads the file
        for folder in ("/handoff/1", "/handoff/2", "/handoff/3"):
            os.chmod(folder, 0o1777)

  ab-node-1:
    <<: *node
    networks: [pair-1, egress-1, sandbox]
    environment:
      <<: *node-env
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: ab-node-1
      NOVNC_ALLOWED_HOSTS: ab-node-1,127.0.0.1,localhost
      NOVNC_ALLOWED_ORIGINS: http://localhost:6080
    volumes: [profile-1:/data/profile]
  ab-controller-1:
    <<: *controller
    networks: [pair-1]
    depends_on:
      ab-node-1: { condition: service_healthy }
      secrets: { condition: service_completed_successfully }
    environment:
      <<: *controller-env
      CONTROLLER_ALLOWED_HOSTS: ab-controller-1,localhost,127.0.0.1,::1
      BROWSER_WS_ENDPOINT_FILE: /node-profile/browser-ws-endpoint.txt
      TAKEOVER_URL: http://ab-node-1:6080/vnc.html?autoconnect=true
    volumes: [profile-1:/node-profile:ro, controller-1:/data, logins:/data/auth, handoff-1:/data/uploads, secrets:/secrets:ro]

  ab-node-2:
    <<: *node
    networks: [pair-2, egress-2, sandbox]
    environment:
      <<: *node-env
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: ab-node-2
      NOVNC_ALLOWED_HOSTS: ab-node-2,127.0.0.1,localhost
      NOVNC_ALLOWED_ORIGINS: http://localhost:6080
    volumes: [profile-2:/data/profile]
  ab-controller-2:
    <<: *controller
    networks: [pair-2]
    depends_on:
      ab-node-2: { condition: service_healthy }
      secrets: { condition: service_completed_successfully }
    environment:
      <<: *controller-env
      CONTROLLER_ALLOWED_HOSTS: ab-controller-2,localhost,127.0.0.1,::1
      BROWSER_WS_ENDPOINT_FILE: /node-profile/browser-ws-endpoint.txt
      TAKEOVER_URL: http://ab-node-2:6080/vnc.html?autoconnect=true
    volumes: [profile-2:/node-profile:ro, controller-2:/data, logins:/data/auth, handoff-2:/data/uploads, secrets:/secrets:ro]

  ab-node-3:
    <<: *node
    networks: [pair-3, egress-3, sandbox]
    environment:
      <<: *node-env
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: ab-node-3
      NOVNC_ALLOWED_HOSTS: ab-node-3,127.0.0.1,localhost
      NOVNC_ALLOWED_ORIGINS: http://localhost:6080
    volumes: [profile-3:/data/profile]
  ab-controller-3:
    <<: *controller
    networks: [pair-3]
    depends_on:
      ab-node-3: { condition: service_healthy }
      secrets: { condition: service_completed_successfully }
    environment:
      <<: *controller-env
      CONTROLLER_ALLOWED_HOSTS: ab-controller-3,localhost,127.0.0.1,::1
      BROWSER_WS_ENDPOINT_FILE: /node-profile/browser-ws-endpoint.txt
      TAKEOVER_URL: http://ab-node-3:6080/vnc.html?autoconnect=true
    volumes: [profile-3:/node-profile:ro, controller-3:/data, logins:/data/auth, handoff-3:/data/uploads, secrets:/secrets:ro]

networks:
  pair-1: { internal: true }
  pair-2: { internal: true }
  pair-3: { internal: true }
  egress-1: {}
  egress-2: {}
  egress-3: {}

volumes:
  secrets: # made on first start by `secrets`
  logins: # auth profiles (saved logins, encrypted), shared by every controller
  profile-1:
  profile-2:
  profile-3:
  controller-1:
  controller-2:
  controller-3:
  handoff-1: # a file on its way into an upload, put there by amuse (pair 1)
  handoff-2:
  handoff-3:
