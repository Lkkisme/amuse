# amuse with its browser pool: `docker compose up -d --build`, then open http://localhost:8080 and
# set the password; models, keys and apps are set up in the app. The browser pool's secrets are
# made on first start and kept in volumes. .env (optional) says where it listens.
# Published on 127.0.0.1 unless AMUSE_PUBLISH_HOST says otherwise (e.g. your Tailscale IP).
# The sandbox is a machine of Amuse's own (see README): its own network, shared with amuse alone, and no secrets.
name: amuse # whatever the folder is called
include:
  - compose.browsers.yaml

x-sandbox-image: &sandbox-image
  build:
    context: .
    dockerfile: sandbox/Dockerfile
  image: amuse-sandbox:local

services:
  amuse:
    build: .
    image: amuse:local
    restart: unless-stopped
    # .env, if there is one; keys an older instance kept there are taken over into the app once
    env_file:
      - path: .env
        required: false
    environment:
      AMUSE_PUBLIC_URL: ${AMUSE_PUBLIC_URL:-http://localhost:8080}
      AMUSE_BROWSERS: pool1|http://ab-controller-1:8000|http://ab-node-1:6080|/handoff/pool1,pool2|http://ab-controller-2:8000|http://ab-node-2:6080|/handoff/pool2,pool3|http://ab-controller-3:8000|http://ab-node-3:6080|/handoff/pool3
      AUTO_BROWSER_TOKEN_FILE: /secrets/auto-browser-token
      # the sandbox's control daemon; set empty (in .env) for no sandbox tools
      AMUSE_SANDBOX_URL: ${AMUSE_SANDBOX_URL-http://sandbox:7070}
      # the sandbox network, whose every request the server turns away (the network below)
      AMUSE_SANDBOX_SUBNET: ${AMUSE_SANDBOX_SUBNET:-10.231.250.0/24}
    networks: [default, sandbox, pair-1, pair-2, pair-3]
    # services the user runs on this machine (a speech server, say) are at host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ab-controller-1: { condition: service_healthy }
      ab-controller-2: { condition: service_healthy }
      ab-controller-3: { condition: service_healthy }
    volumes:
      - amuse-data:/data
      - secrets:/secrets:ro
      - handoff-1:/handoff/pool1
      - handoff-2:/handoff/pool2
      - handoff-3:/handoff/pool3
    ports:
      - "${AMUSE_PUBLISH_HOST:-127.0.0.1}:${AMUSE_PUBLISH_PORT:-8080}:8080"

  # Amuse's own machine. Its daemon (port 7070, as root) runs every command as the normal user `amuse` (uid 1000,
  # with passwordless sudo); the only way in is the `sandbox` network, shared with amuse and nothing else.
  # It reaches the internet (this network is not internal) and holds none of amuse's secrets: no env_file, no
  # /secrets, no Docker socket, not privileged, and only the capabilities sudo, apt and the daemon need. Only the
  # workspace of amuse-data is mounted, not the rest of it, and what the agent reads as its own context (memory/,
  # skills/) and what the user sent (user/) are read-only there: Amuse edits those with its own tools.
  # sudo needs its setuid, so no-new-privileges is not set. Its disk use counts against the data volume.
  # Limits can be changed in .env. A reset in Settings wipes its home folder; system-wide installs and /etc stay
  # until the container is recreated: `docker compose up -d --force-recreate sandbox`.
  sandbox:
    <<: *sandbox-image
    restart: unless-stopped
    init: true
    networks: [sandbox]
    cpus: ${AMUSE_SANDBOX_CPUS:-2}
    mem_limit: ${AMUSE_SANDBOX_MEMORY:-4g}
    memswap_limit: ${AMUSE_SANDBOX_MEMORY:-4g}
    pids_limit: ${AMUSE_SANDBOX_PIDS:-1024}
    # the daemon switches to the user (SETUID, SETGID), stops and cleans up after what it started (KILL, CHOWN,
    # DAC_OVERRIDE, FOWNER); sudo and apt/dpkg need those, FSETID and SETFCAP, and sudo AUDIT_WRITE
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETFCAP, KILL, AUDIT_WRITE]
    depends_on:
      sandbox-init: { condition: service_completed_successfully }
    volumes:
      - sandbox-home:/home/amuse
      - type: volume
        source: amuse-data
        target: /home/amuse/workspace
        volume: { subpath: workspace }
      - type: volume
        source: amuse-data
        target: /home/amuse/workspace/memory
        read_only: true
        volume: { subpath: workspace/memory }
      - type: volume
        source: amuse-data
        target: /home/amuse/workspace/skills
        read_only: true
        volume: { subpath: workspace/skills }
      - type: volume
        source: amuse-data
        target: /home/amuse/workspace/user
        read_only: true
        volume: { subpath: workspace/user }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7070/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # first start only, before the sandbox: the folders amuse-data shares with it must exist to be mounted,
  # and amuse (uid 1000) must own the volume, whichever of them is created first
  sandbox-init:
    <<: *sandbox-image
    user: "0"
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/workspace/memory /data/workspace/skills /data/workspace/user && chown 1000:1000 /data /data/workspace /data/workspace/memory /data/workspace/skills /data/workspace/user
    volumes: [amuse-data:/data]

# a fixed subnet, so the server can turn away the sandbox from its first request; it must not overlap any network on the host
networks:
  sandbox:
    ipam:
      config:
        - subnet: ${AMUSE_SANDBOX_SUBNET:-10.231.250.0/24}

volumes:
  amuse-data:
  sandbox-home: # the sandbox's home folder: what it installs for itself, its configuration, its caches
