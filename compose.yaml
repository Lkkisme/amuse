# Production-style run. Secrets live outside the repo:
#   deploy/remuse.env  REMUSE_TOKEN=…, REMUSE_PI_MODEL=provider/model-id (gitignored)
#   PI_AUTH            path to a Pi auth file          (mounted read-only)
#   COMPOSIO_KEY       path to a Composio ak_ key file  (mounted read-only)
# Published on 127.0.0.1 only; put tailscale serve or a reverse proxy in front.
services:
  remuse:
    build: .
    image: remuse:local
    restart: unless-stopped
    env_file: deploy/remuse.env
    environment:
      REMUSE_PI_AUTH: /run/secrets/pi-auth.json
      REMUSE_COMPOSIO_KEY_FILE: /run/secrets/composio.key
    volumes:
      - remuse-data:/data
      - ${PI_AUTH:?set PI_AUTH to the Pi auth file}:/run/secrets/pi-auth.json:ro
      - ${COMPOSIO_KEY:?set COMPOSIO_KEY to the Composio key file}:/run/secrets/composio.key:ro
    ports:
      - "127.0.0.1:${REMUSE_PUBLISH_PORT:-8080}:8080"
    shm_size: 1gb
volumes:
  remuse-data:
