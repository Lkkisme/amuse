# remuse with its browser pool: `docker compose up -d --build`, then open http://localhost:8080 and
# set the password; models, keys and apps are set up in the app. The browser pool's secrets are
# made on first start and kept in volumes. .env (optional) says where it listens.
# Published on 127.0.0.1 unless REMUSE_PUBLISH_HOST says otherwise (e.g. your Tailscale IP).
include:
  - compose.browsers.yaml

services:
  remuse:
    build: .
    image: remuse:local
    restart: unless-stopped
    # .env, if there is one; keys an older instance kept there are taken over into the app once
    env_file:
      - path: .env
        required: false
    environment:
      REMUSE_PUBLIC_URL: ${REMUSE_PUBLIC_URL:-http://localhost:8080}
      REMUSE_BROWSERS: pool1|http://ab-controller-1:8000|http://ab-node-1:6080|/handoff/pool1,pool2|http://ab-controller-2:8000|http://ab-node-2:6080|/handoff/pool2,pool3|http://ab-controller-3:8000|http://ab-node-3:6080|/handoff/pool3
      AUTO_BROWSER_TOKEN_FILE: /secrets/auto-browser-token
    networks: [default, pair-1, pair-2, pair-3]
    depends_on:
      ab-controller-1: { condition: service_healthy }
      ab-controller-2: { condition: service_healthy }
      ab-controller-3: { condition: service_healthy }
    volumes:
      - remuse-data:/data
      - secrets:/secrets:ro
      - handoff-1:/handoff/pool1
      - handoff-2:/handoff/pool2
      - handoff-3:/handoff/pool3
    ports:
      - "${REMUSE_PUBLISH_HOST:-127.0.0.1}:${REMUSE_PUBLISH_PORT:-8080}:8080"
volumes:
  remuse-data:
